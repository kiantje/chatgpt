<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100 Micro Minigames</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0c101a;
        color: #f4f6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e2540 0%, #0c101a 55%);
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 2rem;
        padding: 3rem 6vw 2rem;
        align-items: center;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.4em;
        color: #87b0ff;
        font-size: 0.75rem;
        margin: 0;
      }

      h1 {
        font-size: clamp(2.5rem, 4vw, 4rem);
        margin: 0.5rem 0 0.75rem;
      }

      .subtitle {
        margin: 0;
        color: #b8c7ff;
        max-width: 40ch;
      }

      .stats {
        display: grid;
        grid-auto-flow: column;
        gap: 1.5rem;
        padding: 1rem 1.5rem;
        background: rgba(10, 14, 26, 0.6);
        border-radius: 1.25rem;
        border: 1px solid rgba(120, 140, 255, 0.2);
      }

      .stats span {
        font-size: 1.75rem;
        font-weight: 600;
        display: block;
      }

      .stats small {
        color: #8ea0ff;
      }

      main {
        padding: 0 6vw 4rem;
      }

      .panel {
        background: rgba(7, 10, 20, 0.8);
        border-radius: 1.5rem;
        padding: 2rem;
        border: 1px solid rgba(90, 110, 220, 0.2);
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        gap: 2rem;
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .hint {
        color: #9fb0f8;
      }

      .picker {
        display: grid;
        gap: 0.5rem;
        min-width: min(320px, 100%);
      }

      .picker label {
        font-size: 0.85rem;
        color: #9fb0f8;
      }

      .picker-controls {
        display: flex;
        gap: 0.75rem;
      }

      .grid {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }

      .card {
        padding: 1rem;
        border-radius: 1rem;
        background: rgba(18, 24, 42, 0.9);
        border: 1px solid rgba(120, 140, 255, 0.15);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 140px;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: rgba(120, 140, 255, 0.4);
      }

      .card h4 {
        margin: 0;
        font-size: 1.05rem;
      }

      .card p {
        margin: 0;
        color: #a5b6ff;
        font-size: 0.9rem;
      }

      .card button {
        margin-top: auto;
        padding: 0.5rem 0.8rem;
        border-radius: 0.65rem;
        border: none;
        background: #7a5cff;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(3, 5, 12, 0.75);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .overlay.hidden {
        display: none;
      }

      .modal {
        width: min(560px, 90vw);
        background: #11162b;
        border-radius: 1.2rem;
        padding: 2rem;
        border: 1px solid rgba(120, 140, 255, 0.3);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        position: relative;
      }

      .close {
        position: absolute;
        right: 1rem;
        top: 1rem;
        background: none;
        border: none;
        color: #aab7ff;
        font-size: 1.2rem;
        cursor: pointer;
      }

      .game-ui {
        margin: 1.5rem 0;
        display: grid;
        gap: 0.75rem;
      }

      .game-ui input,
      .game-ui select,
      .picker select {
        padding: 0.6rem 0.8rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(120, 140, 255, 0.2);
        background: #0b1020;
        color: white;
        flex: 1;
      }

      .actions {
        display: flex;
        gap: 1rem;
      }

      .primary {
        flex: 1;
        background: #7a5cff;
        border: none;
        color: white;
        padding: 0.7rem 1rem;
        border-radius: 0.6rem;
        cursor: pointer;
        font-weight: 600;
      }

      .ghost {
        flex: 1;
        background: transparent;
        border: 1px solid rgba(120, 140, 255, 0.4);
        color: #c8d2ff;
        border-radius: 0.6rem;
        cursor: pointer;
      }

      .result {
        margin-top: 1rem;
        font-weight: 600;
        color: #7effb4;
      }

      .result.fail {
        color: #ff8ba0;
      }

      @media (max-width: 760px) {
        .hero {
          flex-direction: column;
          align-items: flex-start;
        }

        .stats {
          grid-auto-flow: row;
          width: 100%;
        }

        .picker-controls {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">One Cartridge</p>
        <h1>100 Micro Minigames</h1>
        <p class="subtitle">
          Pick any micro challenge. Play in seconds. Stack quick wins.
        </p>
      </div>
      <div class="stats">
        <div>
          <span id="wins">0</span>
          <small>Wins</small>
        </div>
        <div>
          <span id="plays">0</span>
          <small>Plays</small>
        </div>
        <div>
          <span id="streak">0</span>
          <small>Win Streak</small>
        </div>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h2>Choose a game</h2>
            <p class="hint">
              Each card is a tiny challenge. Hit play to launch the game panel.
            </p>
          </div>
          <div class="picker">
            <label for="game-select">Jump to game</label>
            <div class="picker-controls">
              <select id="game-select"></select>
              <button id="random" class="ghost" type="button">Random</button>
            </div>
          </div>
        </div>
        <div id="game-grid" class="grid"></div>
      </section>
    </main>

    <div id="overlay" class="overlay hidden" aria-hidden="true">
      <div class="modal">
        <button id="close" class="close" aria-label="Close" type="button">✕</button>
        <h3 id="game-title"></h3>
        <p id="game-desc"></p>
        <div id="game-ui" class="game-ui"></div>
        <div class="actions">
          <button id="play" class="primary" type="button">Play</button>
          <button id="reset" class="ghost" type="button">Reset</button>
        </div>
        <div id="result" class="result"></div>
      </div>
    </div>

    <script>
      const grid = document.getElementById("game-grid");
      const overlay = document.getElementById("overlay");
      const closeBtn = document.getElementById("close");
      const playBtn = document.getElementById("play");
      const resetBtn = document.getElementById("reset");
      const titleEl = document.getElementById("game-title");
      const descEl = document.getElementById("game-desc");
      const uiEl = document.getElementById("game-ui");
      const resultEl = document.getElementById("result");
      const winsEl = document.getElementById("wins");
      const playsEl = document.getElementById("plays");
      const streakEl = document.getElementById("streak");
      const gameSelect = document.getElementById("game-select");
      const randomBtn = document.getElementById("random");

      const baseTypes = [
        {
          type: "guess",
          label: "Guess Glide",
          description: "Pick the correct number between 1 and 5.",
        },
        {
          type: "math",
          label: "Quick Math",
          description: "Solve a tiny math equation in one shot.",
        },
        {
          type: "reaction",
          label: "Reaction Spark",
          description: "Wait for green, then click as fast as you can.",
        },
        {
          type: "click",
          label: "Click Sprint",
          description: "Click the button 10 times before the timer ends.",
        },
        {
          type: "memory",
          label: "Memory Flash",
          description: "Memorize a short number sequence, then repeat it.",
        },
        {
          type: "scramble",
          label: "Word Scramble",
          description: "Unscramble a short word.",
        },
        {
          type: "color",
          label: "Color Match",
          description: "Pick the label that matches the displayed color.",
        },
        {
          type: "typing",
          label: "Typing Dash",
          description: "Type a short phrase exactly.",
        },
        {
          type: "coin",
          label: "Coin Flip",
          description: "Call the flip correctly.",
        },
        {
          type: "pattern",
          label: "Pattern Pulse",
          description: "Spot the missing number in a simple pattern.",
        },
      ];

      const words = [
        "nova",
        "pixel",
        "orbit",
        "spark",
        "ghost",
        "pulse",
        "vivid",
        "ember",
      ];
      const phrases = [
        "sky jump",
        "fast lane",
        "neon wave",
        "drift mode",
        "blue comet",
        "silent run",
      ];
      const colors = [
        { name: "Crimson", value: "#ff5b6c" },
        { name: "Ocean", value: "#4dd2ff" },
        { name: "Lime", value: "#8cff6a" },
        { name: "Gold", value: "#ffd166" },
        { name: "Violet", value: "#b18bff" },
      ];

      const games = Array.from({ length: 100 }, (_, index) => {
        const base = baseTypes[index % baseTypes.length];
        return {
          id: index + 1,
          name: `${base.label} ${index + 1}`,
          description: base.description,
          type: base.type,
        };
      });

      let activeGame = null;
      let gameState = {};
      let plays = 0;
      let wins = 0;
      let streak = 0;

      function updateScoreboard(isWin) {
        plays += 1;
        if (isWin) {
          wins += 1;
          streak += 1;
        } else {
          streak = 0;
        }
        winsEl.textContent = wins;
        playsEl.textContent = plays;
        streakEl.textContent = streak;
      }

      function openGame(game) {
        activeGame = game;
        titleEl.textContent = `${game.name}`;
        descEl.textContent = game.description;
        resultEl.textContent = "";
        resultEl.classList.remove("fail");
        uiEl.innerHTML = "";
        gameState = {};
        overlay.classList.remove("hidden");
        overlay.setAttribute("aria-hidden", "false");
        buildUI(game.type);
      }

      function closeGame() {
        overlay.classList.add("hidden");
        overlay.setAttribute("aria-hidden", "true");
        activeGame = null;
        gameState = {};
      }

      function buildUI(type) {
        if (type === "guess") {
          const input = document.createElement("input");
          input.type = "number";
          input.min = "1";
          input.max = "5";
          input.placeholder = "Enter 1-5";
          uiEl.appendChild(input);
          gameState.input = input;
        }

        if (type === "math") {
          const a = rand(3, 12);
          const b = rand(2, 9);
          gameState.answer = a + b;
          const label = document.createElement("div");
          label.textContent = `${a} + ${b} = ?`;
          const input = document.createElement("input");
          input.type = "number";
          input.placeholder = "Your answer";
          uiEl.append(label, input);
          gameState.input = input;
        }

        if (type === "reaction") {
          const status = document.createElement("div");
          status.textContent = "Wait for green...";
          const btn = document.createElement("button");
          btn.className = "primary";
          btn.textContent = "Ready";
          btn.type = "button";
          btn.disabled = true;
          uiEl.append(status, btn);
          const delay = rand(800, 2400);
          gameState.start = null;
          gameState.timer = setTimeout(() => {
            status.textContent = "GO!";
            status.style.color = "#7effb4";
            btn.disabled = false;
            gameState.start = performance.now();
          }, delay);
          btn.addEventListener("click", () => {
            if (!gameState.start) return;
            const reaction = Math.round(performance.now() - gameState.start);
            gameState.reaction = reaction;
            status.textContent = `Reaction: ${reaction}ms`;
            btn.disabled = true;
          });
          gameState.status = status;
        }

        if (type === "click") {
          const counter = document.createElement("div");
          counter.textContent = "Clicks: 0 / 10";
          const btn = document.createElement("button");
          btn.className = "primary";
          btn.textContent = "Click!";
          btn.type = "button";
          const timer = document.createElement("div");
          timer.textContent = "Time: 3.0s";
          uiEl.append(counter, btn, timer);
          gameState.clicks = 0;
          gameState.started = false;
          btn.addEventListener("click", () => {
            if (!gameState.started) {
              gameState.started = true;
              const start = performance.now();
              const tick = () => {
                const elapsed = performance.now() - start;
                const remaining = Math.max(0, 3000 - elapsed);
                timer.textContent = `Time: ${(remaining / 1000).toFixed(1)}s`;
                if (remaining > 0) {
                  gameState.timer = requestAnimationFrame(tick);
                }
              };
              gameState.timer = requestAnimationFrame(tick);
            }
            gameState.clicks += 1;
            counter.textContent = `Clicks: ${gameState.clicks} / 10`;
          });
        }

        if (type === "memory") {
          const sequence = Array.from({ length: 4 }, () => rand(0, 9)).join("");
          const display = document.createElement("div");
          display.textContent = sequence;
          display.style.fontSize = "1.6rem";
          display.style.letterSpacing = "0.3rem";
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Repeat the sequence";
          uiEl.append(display, input);
          gameState.sequence = sequence;
          gameState.input = input;
          setTimeout(() => {
            display.textContent = "••••";
          }, 1800);
        }

        if (type === "scramble") {
          const word = pick(words);
          const scrambled = word
            .split("")
            .sort(() => Math.random() - 0.5)
            .join("");
          const label = document.createElement("div");
          label.textContent = `Unscramble: ${scrambled}`;
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Type the word";
          uiEl.append(label, input);
          gameState.answer = word;
          gameState.input = input;
        }

        if (type === "color") {
          const color = pick(colors);
          const swatch = document.createElement("div");
          swatch.textContent = "Color Swatch";
          swatch.style.background = color.value;
          swatch.style.padding = "1rem";
          swatch.style.borderRadius = "0.5rem";
          const select = document.createElement("select");
          colors.forEach((entry) => {
            const option = document.createElement("option");
            option.value = entry.name;
            option.textContent = entry.name;
            select.appendChild(option);
          });
          uiEl.append(swatch, select);
          gameState.answer = color.name;
          gameState.select = select;
        }

        if (type === "typing") {
          const phrase = pick(phrases);
          const label = document.createElement("div");
          label.textContent = `Type: “${phrase}”`;
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = phrase;
          uiEl.append(label, input);
          gameState.answer = phrase;
          gameState.input = input;
        }

        if (type === "coin") {
          const select = document.createElement("select");
          ["Heads", "Tails"].forEach((side) => {
            const option = document.createElement("option");
            option.value = side;
            option.textContent = side;
            select.appendChild(option);
          });
          uiEl.append(select);
          gameState.select = select;
        }

        if (type === "pattern") {
          const start = rand(2, 7);
          const step = rand(2, 5);
          const missingIndex = rand(2, 4);
          const sequence = Array.from({ length: 5 }, (_, i) => start + step * i);
          const answer = sequence[missingIndex];
          sequence[missingIndex] = "?";
          const label = document.createElement("div");
          label.textContent = `Pattern: ${sequence.join("  ")}`;
          const input = document.createElement("input");
          input.type = "number";
          input.placeholder = "Missing number";
          uiEl.append(label, input);
          gameState.answer = answer;
          gameState.input = input;
        }
      }

      function handlePlay() {
        if (!activeGame) return;
        const type = activeGame.type;
        let isWin = false;
        let message = "";

        if (type === "guess") {
          const value = Number(gameState.input.value);
          const answer = rand(1, 5);
          isWin = value === answer;
          message = isWin
            ? "Spot on!"
            : `Close! The number was ${answer}.`;
        }

        if (type === "math") {
          const value = Number(gameState.input.value);
          isWin = value === gameState.answer;
          message = isWin ? "Correct!" : `Answer: ${gameState.answer}.`;
        }

        if (type === "reaction") {
          if (!gameState.reaction) {
            message = "Tap only after the button turns ready.";
            isWin = false;
          } else {
            isWin = gameState.reaction < 350;
            message = isWin
              ? `Blazing! ${gameState.reaction}ms.`
              : `Nice try: ${gameState.reaction}ms.`;
          }
        }

        if (type === "click") {
          isWin = gameState.clicks >= 10;
          message = isWin
            ? "You hit the click goal!"
            : `You reached ${gameState.clicks} clicks.`;
        }

        if (type === "memory") {
          const value = gameState.input.value.trim();
          isWin = value === gameState.sequence;
          message = isWin
            ? "Perfect memory!"
            : `Sequence was ${gameState.sequence}.`;
        }

        if (type === "scramble") {
          const value = gameState.input.value.trim().toLowerCase();
          isWin = value === gameState.answer;
          message = isWin ? "You decoded it!" : `Word was “${gameState.answer}”.`;
        }

        if (type === "color") {
          const value = gameState.select.value;
          isWin = value === gameState.answer;
          message = isWin ? "Color locked." : `Correct: ${gameState.answer}.`;
        }

        if (type === "typing") {
          const value = gameState.input.value.trim();
          isWin = value === gameState.answer;
          message = isWin ? "Clean typing!" : "Almost. Check spacing.";
        }

        if (type === "coin") {
          const call = gameState.select.value;
          const flip = Math.random() < 0.5 ? "Heads" : "Tails";
          isWin = call === flip;
          message = isWin ? "You called it!" : `It landed on ${flip}.`;
        }

        if (type === "pattern") {
          const value = Number(gameState.input.value);
          isWin = value === gameState.answer;
          message = isWin
            ? "Pattern solved."
            : `Missing number: ${gameState.answer}.`;
        }

        updateScoreboard(isWin);
        resultEl.textContent = message;
        resultEl.classList.toggle("fail", !isWin);
      }

      function handleReset() {
        if (!activeGame) return;
        if (gameState.timer) {
          clearTimeout(gameState.timer);
          cancelAnimationFrame(gameState.timer);
        }
        openGame(activeGame);
      }

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function pick(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function renderGameSelect() {
        gameSelect.innerHTML = "";
        games.forEach((game) => {
          const option = document.createElement("option");
          option.value = game.id;
          option.textContent = `${game.id}. ${game.name}`;
          gameSelect.appendChild(option);
        });
      }

      function handleSelectChange() {
        const selectedId = Number(gameSelect.value);
        const game = games.find((entry) => entry.id === selectedId);
        if (game) {
          openGame(game);
        }
      }

      function handleRandom() {
        const game = pick(games);
        gameSelect.value = String(game.id);
        openGame(game);
      }

      games.forEach((game) => {
        const card = document.createElement("div");
        card.className = "card";
        const name = document.createElement("h4");
        name.textContent = game.name;
        const desc = document.createElement("p");
        desc.textContent = game.description;
        const button = document.createElement("button");
        button.textContent = "Play";
        button.type = "button";
        button.addEventListener("click", () => openGame(game));
        card.append(name, desc, button);
        card.addEventListener("click", (event) => {
          if (event.target.tagName !== "BUTTON") {
            openGame(game);
          }
        });
        grid.appendChild(card);
      });

      renderGameSelect();

      gameSelect.addEventListener("change", handleSelectChange);
      randomBtn.addEventListener("click", handleRandom);
      closeBtn.addEventListener("click", closeGame);
      playBtn.addEventListener("click", handlePlay);
      resetBtn.addEventListener("click", handleReset);

      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeGame();
      });
    </script>
  </body>
</html>
